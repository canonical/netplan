summary: Check that failing backend operations are reported as failures

details: |
  'netplan apply' starts netplan-ovs-cleanup.service whenever networkd
  configuration exists. With that unit masked the start fails: netplan
  apply and D-Bus Apply() must report the failure, not success.

  Inside 'netplan try' the same failure makes try roll back by itself
  before it is ready for confirmation, so D-Bus Try() reports false and
  the previous configuration stays in place.

prepare: |
  systemctl mask netplan-ovs-cleanup.service

restore: |
  . "$SPREAD_PATH"/tests/spread/lib.sh
  systemctl unmask netplan-ovs-cleanup.service
  wait_for_try_to_finish 60 || pkill -f 'netplan try' || true
  rm -f /etc/netplan/90-test.yaml "$TRY_STAMP"
  netplan apply

debug: |
  systemctl status netplan-ovs-cleanup.service --no-pager || true
  cat /run/systemd/network/10-netplan-br54.network || true

execute: |
  . "$SPREAD_PATH"/tests/spread/lib.sh

  # the CLI fails
  not netplan apply

  # D-Bus Apply() fails
  not busctl call --system io.netplan.Netplan /io/netplan/Netplan io.netplan.Netplan Apply

  # Try() of a change rolls back and reports false
  obj=$(netplan_config_object)
  config_call "$obj" Set ss bridges.br54.dhcp4=false 90-test | MATCH 'b true'
  config_call "$obj" Try u 30 | MATCH 'b false'
  wait_for_try_to_finish 60
  br54_backend_has_dhcp4
  # netplan-dbus restores the YAML once the try process has exited
  for _ in $(seq 30); do
      test -e /etc/netplan/90-test.yaml || break
      sleep 1
  done
  test ! -e /etc/netplan/90-test.yaml
  netplan get bridges.br54.dhcp4 | MATCH true
