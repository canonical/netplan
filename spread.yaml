project: netplan

backends:
  lxd:
    systems: [ubuntu-26.04]
  qemu:
    systems:
      - ubuntu-26.04-64:
          username: ubuntu
          password: ubuntu

# Every task runs once per netplan CLI implementation: the Python CLI and
# the Rust CLI (meson -Dcli=rust), installed as /usr/sbin/netplan.
environment:
  NETPLAN_CLI/python: python
  NETPLAN_CLI/rust: rust

suites:
  tests/spread/:
    summary: integration tests

path: /home/tests

prepare: |
  # FIXME: having the debian packging available would allow "apt
  # build-dep -y ./" would make this easier :)
  apt update -qq
  apt install -y ubuntu-dev-tools devscripts equivs curl file
  pull-lp-source netplan.io
  sed -i 's| openvswitch-switch|# DELETED: openvswitch-switch|' netplan.io-*/debian/control
  mk-build-deps -i -r -B -s sudo -t "apt-get -y -o Debug::pkgProblemResolver=yes --no-install-recommends" netplan.io-*/debian/control
  # Rust toolchain for the Rust CLI; version and components come from
  # netplan_cli_rs/rust-toolchain.toml
  curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
  export PATH="$HOME/.cargo/bin:$PATH"
  # Build both CLIs once; prepare-each installs the one of the variant
  meson setup build-python --prefix=/usr -Dcli=python
  meson compile -C build-python
  meson setup build-rust --prefix=/usr -Dcli=rust
  meson compile -C build-rust
  #meson test -C build --verbose, cannot run OVS test in container
  rm -rf /usr/share/netplan/netplan  # clear (old) system installation
  meson install -C build-python --destdir=/ --no-rebuild
  # set some defaults
  cat > /etc/netplan/0-snapd-defaults.yaml <<'EOF'
  network:
    version: 2
    bridges:
      br54:
        dhcp4: true
  EOF
  chmod 0600 /etc/netplan/0-snapd-defaults.yaml
  echo "Precondition check, the basics work"
  netplan get bridges.br54.dhcp4 | MATCH true
  # keep original config around
  tar cvf "$SPREAD_PATH"/etc-netplan.tar.gz /etc/netplan/

prepare-each: |
  # Install the netplan CLI of this variant. /usr/sbin/netplan is a symlink
  # to the Python script with -Dcli=python and the Rust binary with
  # -Dcli=rust; remove it first so neither install writes through the other.
  rm -f /usr/sbin/netplan
  meson install -C "$SPREAD_PATH/build-$NETPLAN_CLI" --destdir=/ --no-rebuild --quiet
  # Start each task from the default configuration, applied
  netplan apply

restore-each: |
  # restore original netplan dir
  rm -rf /etc/netplan/*
  (cd / && tar xvf "$SPREAD_PATH"/etc-netplan.tar.gz)
